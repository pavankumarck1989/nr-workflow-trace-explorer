<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Workflow Trace Explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a6fc2"/>
      <stop offset="1" stop-color="#12b3a4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- waterfall: spans cascading across time -->
  <rect x="86" y="118" width="150" height="42" rx="21" fill="#fff"/>
  <rect x="136" y="182" width="190" height="42" rx="21" fill="#fff" fill-opacity="0.92"/>
  <rect x="196" y="246" width="116" height="42" rx="21" fill="#fff" fill-opacity="0.84"/>
  <!-- collapsed idle gap that stitches two traces into one workflow -->
  <path d="M312 267 H360 V332" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22" stroke-opacity="0.9"/>
  <rect x="330" y="310" width="96" height="42" rx="21" fill="#fff" fill-opacity="0.9"/>
  <!-- baseline: the single workflow timeline -->
  <rect x="86" y="392" width="340" height="10" rx="5" fill="#fff" fill-opacity="0.35"/>
  <circle cx="91" cy="397" r="11" fill="#fff"/>
  <circle cx="421" cy="397" r="11" fill="#fff"/>
</svg>
